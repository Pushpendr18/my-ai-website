<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musafir Mix • Natural Tones Nostalgic Journey</title>
  <meta name="description" content="A deeply nostalgic, cinematic music experience inspired by Indian road trips, railway journeys, retro cassette tapes, and timeless wanderlust in Natural Tones." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&family=VT323&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amber: {
              400: '#d4a373',
              500: '#c28e5c',
              600: '#8b5e34',
              900: '#2c1e14',
              950: '#1a120b',
            },
            natural: {
              bg: '#1a120b',
              radial: '#2c1e14',
              sand: '#d4a373',
              cream: '#e6d5b8',
              terra: '#8b5e34',
              earth: '#4a321d',
              dark: '#222222',
            },
            retro: {
              bg: '#1a120b',
              card: '#241910',
              accent: '#d4a373',
              cream: '#e6d5b8',
              rust: '#8b5e34',
              indigo: '#1c1510',
              brass: '#d4a373',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Georgia"', 'serif'],
            display: ['"Cinzel"', '"Georgia"', 'serif'],
            mono: ['"VT323"', 'monospace'],
            hand: ['"Caveat"', 'cursive'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: radial-gradient(circle at 50% 50%, #2c1e14 0%, #1a120b 100%);
      color: #e6d5b8;
    }

    /* Natural Tones Background Grid Dot Pattern */
    .bg-grid-dots {
      background-image: radial-gradient(rgba(212, 163, 115, 0.15) 0.5px, transparent 0.5px);
      background-size: 20px 20px;
    }

    /* Custom CSS Effects & Keyframes */
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.25; filter: drop-shadow(0 0 15px rgba(212, 163, 115, 0.3)); }
      50% { opacity: 0.6; filter: drop-shadow(0 0 30px rgba(139, 94, 52, 0.6)); }
    }
    @keyframes road-move {
      0% { background-position: 0% 0%; }
      100% { background-position: 1000px 0%; }
    }
    @keyframes wiper-sweep {
      0%, 100% { transform: rotate(-60deg); }
      50% { transform: rotate(60deg); }
    }
    @keyframes bus-vibrate {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      25% { transform: translateY(-1px) translateX(0.5px); }
      50% { transform: translateY(1px) translateX(-0.5px); }
      75% { transform: translateY(-0.5px) translateX(1px); }
    }

    .animate-road-scrolling {
      animation: road-move 10s linear infinite;
    }
    .animate-wiper {
      animation: wiper-sweep 2.5s ease-in-out infinite;
      transform-origin: bottom center;
    }
    .animate-bus-rumble {
      animation: bus-vibrate 0.15s ease-in-out infinite;
    }

    .animate-spin-spool {
      animation: spin-slow 4s linear infinite;
    }

    /* Vignette Overlay */
    .film-overlay {
      background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
    }

    /* Glassmorphism Natural Cards */
    .glass-card-natural {
      background: rgba(44, 30, 20, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 163, 115, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .glass-player-natural {
      background: rgba(26, 18, 11, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(212, 163, 115, 0.25);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1a120b;
    }
    ::-webkit-scrollbar-thumb {
      background: #8b5e34;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-[#1a120b] text-[#e6d5b8] font-sans min-h-screen overflow-x-hidden relative selection:bg-[#8b5e34] selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
